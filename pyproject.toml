[project]
name = "no-as-a-service-slack"
version = "0.1.0"
description = "Slack bot that gives you a reason to say no"
readme = "README.md"
authors = [ { name = "Basil Shubin", email = "basil.shubin@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "environs>=15.2",
  "slack-bolt>=1.30",
  "slack-sdk[optional]>=3.45",
]
